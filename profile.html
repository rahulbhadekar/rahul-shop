<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Account - RAHUL.SHOP</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            color: #222;
        }

        /* HEADER */

        .header {
            background: #000;
            color: white;
            padding: 20px 50px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .back-btn {
            color: white;
            text-decoration: none;
        }

        /* MAIN */

        .account-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;

            display: flex;
            gap: 25px;
        }

        /* SIDEBAR */

        .sidebar {
            width: 280px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .profile-mini {
            padding: 25px;
            background: #013f59;
            color: white;
        }

        .profile-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;

            background: white;
            color: #013f59;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 30px;
            margin-bottom: 12px;
        }

        .profile-mini h3 {
            margin-bottom: 5px;
        }

        .profile-mini p {
            font-size: 14px;
            word-break: break-word;
        }

        .menu-item {
            display: block;
            padding: 18px 22px;

            color: #222;
            text-decoration: none;

            border-bottom: 1px solid #eee;
        }

        .menu-item:hover {
            background: #f5f5f5;
        }

        /* CONTENT */

        .content {
            flex: 1;
            background: white;

            border-radius: 10px;
            padding: 30px;

            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .content h1 {
            margin-bottom: 25px;
        }

        .info-box {
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .info-label {
            color: #777;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .info-value {
            font-size: 17px;
            font-weight: bold;
        }

        .logout-btn {
            width: 100%;

            padding: 14px;

            border: none;
            background: #d32f2f;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .logout-btn:hover {
            background: #b71c1c;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .header {
                padding: 20px;
            }

            .account-container {
                flex-direction: column;
                margin: 20px auto;
            }

            .sidebar {
                width: 100%;
            }

        }

    </style>

</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <div class="logo">
            RAHUL.SHOP
        </div>

        <a href="index.html" class="back-btn">
            ← Continue Shopping
        </a>

    </header>


    <!-- ACCOUNT -->

    <div class="account-container">

        <!-- SIDEBAR -->

        <div class="sidebar">

            <div class="profile-mini">

                <div class="profile-icon">
                    👤
                </div>

                <h3 id="sideName">
                    User
                </h3>

                <p id="sideEmail">
                    email@example.com
                </p>

            </div>


            <a href="profile.html" class="menu-item">
                👤 My Profile
            </a>

            <a href="my-orders.html" class="menu-item">
                📦 My Orders
            </a>

            <a href="cart.html" class="menu-item">
                🛒 My Cart
            </a>

            <a href="#" class="menu-item">
                ❤️ My Wishlist
            </a>

            <a href="#" class="menu-item">
                📍 My Addresses
            </a>

            <button
                class="logout-btn"
                onclick="logout()">

                🚪 Logout

            </button>

        </div>


        <!-- PROFILE CONTENT -->

        <div class="content">

            <h1>
                My Profile
            </h1>


            <div class="info-box">

                <div class="info-label">
                    Full Name
                </div>

                <div
                    class="info-value"
                    id="userName">

                    Loading...

                </div>

            </div>


            <div class="info-box">

                <div class="info-label">
                    Email Address
                </div>

                <div
                    class="info-value"
                    id="userEmail">

                    Loading...

                </div>

            </div>


            <div class="info-box">

                <div class="info-label">
                    Account Type
                </div>

                <div
                    class="info-value"
                    id="userRole">

                    Loading...

                </div>

            </div>


            <div class="info-box">

                <div class="info-label">
                    User ID
                </div>

                <div
                    class="info-value"
                    id="userId">

                    Loading...

                </div>

            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="auth.js"></script>

    <script>

        // Login check

        if (!isLoggedIn()) {

            window.location.href = "login.html";

        }


        // User data

        const userData =
            JSON.parse(localStorage.getItem("user"));


        if (userData) {

            document.getElementById("userName")
                .innerText = userData.name;

            document.getElementById("userEmail")
                .innerText = userData.email;

            document.getElementById("userRole")
                .innerText = userData.role;

            document.getElementById("userId")
                .innerText = userData.id;


            document.getElementById("sideName")
                .innerText = userData.name;

            document.getElementById("sideEmail")
                .innerText = userData.email;

        }

    </script>

</body>

</html>
