<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Panel - RAHUL.SHOP</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .header {
            background: #013f59;
            color: white;
            padding: 20px 50px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .back-btn {
            color: white;
            text-decoration: none;
        }

        .admin-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .admin-title {
            margin-bottom: 25px;
        }

        .form-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .form-box h2 {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        textarea {
            height: 100px;
            resize: none;
        }

        .add-btn {
            background: #013f59;
            color: white;
            border: none;
            padding: 13px 25px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        .add-btn:hover {
            background: #025d80;
        }

        .products-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        .product {
            border-bottom: 1px solid #ddd;
            padding: 20px 0;

            display: flex;
            align-items: center;
            gap: 20px;
        }

        .product img {
            width: 100px;
            height: 100px;
            object-fit: contain;
        }

        .product-info {
            flex: 1;
        }

        .product-info h3 {
            margin-bottom: 8px;
        }

        .delete-btn {
            background: #d32f2f;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #b71c1c;
        }

        @media (max-width: 600px) {

            .header {
                padding: 20px;
            }

            .product {
                flex-direction: column;
                align-items: flex-start;
            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header class="header">

        <div class="logo">
            RAHUL.SHOP ADMIN
        </div>

        <a href="index.html" class="back-btn">
            ← Shop
        </a>

    </header>



    <div class="admin-container">


        <h1 class="admin-title">
            Admin Product Management
        </h1>



        <!-- ADD PRODUCT -->

        <div class="form-box">

            <h2>
                Add New Product
            </h2>


            <form id="productForm">


                <div class="form-group">

                    <label>
                        Product Name
                    </label>

                    <input
                        type="text"
                        id="productName"
                        placeholder="Enter product name"
                        required
                    >

                </div>



                <div class="form-group">

                    <label>
                        Price
                    </label>

                    <input
                        type="number"
                        id="productPrice"
                        placeholder="Enter price"
                        required
                    >

                </div>



                <div class="form-group">

                    <label>
                        Image URL
                    </label>

                    <input
                        type="text"
                        id="productImage"
                        placeholder="Enter image URL"
                        required
                    >

                </div>



                <div class="form-group">

                    <label>
                        Description
                    </label>

                    <textarea
                        id="productDescription"
                        placeholder="Enter description"
                        required
                    ></textarea>

                </div>



                <button
                    type="submit"
                    class="add-btn">

                    Add Product

                </button>


            </form>

        </div>

        <div class="form-box" id="editFormContainer" style="display: none;">

    <h2>Edit Product</h2>

    <input type="hidden" id="editProductId">

    <div class="form-group">

        <label>Product Name</label>

        <input
            type="text"
            id="editName"
            placeholder="Enter product name"
        >

    </div>

    <div class="form-group">

        <label>Price</label>

        <input
            type="number"
            id="editPrice"
            placeholder="Enter price"
        >

    </div>

    <div class="form-group">

        <label>Image URL</label>

        <input
            type="text"
            id="editImageUrl"
            placeholder="Enter image URL"
        >

    </div>

    <div class="form-group">

        <label>Description</label>

        <textarea
            id="editDescription"
            placeholder="Enter description">
        </textarea>

    </div>

    <button
        type="button"
        class="add-btn"
        onclick="updateProduct()">

        Update Product

    </button>

    <button
        type="button"
        onclick="cancelEdit()">

        Cancel

    </button>

</div>



        <!-- PRODUCTS -->

        <div class="products-box">

            <h2>
                All Products
            </h2>


            <div id="productList">

                Loading products...

            </div>


        </div>


    </div>

    <div class="products-box">

    <h2>All Orders</h2>

    <div id="orderList">
        Loading orders...
    </div>

</div>

<script src="auth.js"></script>
<script>
    console.log("AUTH TEST:", typeof authFetch);
    console.log("LOGIN TEST:", typeof isLoggedIn);

    // Admin page login check
    if (!isLoggedIn()) {
        window.location.href = "login.html";
    }

    // tumhara existing admin JavaScript yahin rahega
</script>
    <!-- JAVASCRIPT -->

    <script>


        // =====================================
        // LOAD PRODUCTS
        // =====================================

        function loadProducts() {


            authFetch("http://localhost:8080/api/products")

                .then(response => response.json())

                .then(products => {


                    const productList =
                        document.getElementById("productList");


                    productList.innerHTML = "";


                    products.forEach(product => {


                        const productDiv =
                            document.createElement("div");


                        productDiv.classList.add(
                            "product"
                        );


                        productDiv.innerHTML = `

                            <img
                                src="${product.imageUrl}"
                                alt="${product.name}"
                            >

                            <div class="product-info">

                                <h3>
                                    ${product.name}
                                </h3>

                                <p>
                                    ₹${product.price}
                                </p>

                                <p>
                                    ${product.description}
                                </p>

                            </div>

                            <button
    class="edit-btn"
    onclick="editProduct(${product.id})">

    Edit

</button>

<button
    class="delete-btn"
    onclick="deleteProduct(${product.id})">

    Delete

</button>

                        `;
                        




                        productList.appendChild(
                            productDiv
                        );

                    });

                })

                .catch(error => {

                    console.error(
                        "Error loading products:",
                        error
                    );

                });

        }


        function loadOrders() {

    authFetch("http://localhost:8080/api/orders")

        .then(response => response.json())

        .then(orders => {

            const orderList = document.getElementById("orderList");

            orderList.innerHTML = "";

            if (orders.length === 0) {

                orderList.innerHTML = "<p>No orders found.</p>";

                return;
            }

            orders.forEach(order => {

                const orderCard = document.createElement("div");

                orderCard.innerHTML = `
                
                    <div style="
                        border: 1px solid #ddd;
                        padding: 20px;
                        margin: 15px 0;
                        border-radius: 10px;
                    ">

                        <h3>Order #${order.id}</h3>

                        <p>
                            <strong>Customer:</strong>
                            ${order.customerName}
                        </p>

                        <p>
                            <strong>Email:</strong>
                            ${order.customerEmail}
                        </p>

                        <p>
                            <strong>Address:</strong>
                            ${order.customerAddress}
                        </p>

                        <p>
                            <strong>Total:</strong>
                            ₹${order.totalAmount}
                        </p>

                        <p>
                            <strong>Status:</strong>
                            ${order.status}
                        </p>

                    </div>

                `;

                orderList.appendChild(orderCard);

            });

        })

        .catch(error => {

            console.error("Order Loading Error:", error);

        });

}



        // =====================================
        // ADD PRODUCT
        // =====================================

        document.getElementById("productForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();


                const product = {

                    name:
                        document.getElementById("productName").value,

                    price:
                        Number(
                            document.getElementById("productPrice").value
                        ),

                    imageUrl:
                        document.getElementById("productImage").value,

                    description:
                        document.getElementById("productDescription").value

                };


                authFetch("http://localhost:8080/api/products", {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify(product)

                })

                    .then(response => response.json())

                    .then(data => {


                        console.log(
                            "Product Added:",
                            data
                        );


                        alert(
                            "Product added successfully! 🎉"
                        );


                        document.getElementById(
                            "productForm"
                        ).reset();


                        loadProducts();
                        loadOrders();

                    })

                    .catch(error => {

                        console.error(
                            "Add Product Error:",
                            error
                        );

                    });

            });

            function editProduct(id) {

    authFetch(`http://localhost:8080/api/products/${id}`)

        .then(response => response.json())

        .then(product => {

            document.getElementById("editProductId").value = product.id;

            document.getElementById("editName").value = product.name;

            document.getElementById("editPrice").value = product.price;

            document.getElementById("editImageUrl").value = product.imageUrl;

            document.getElementById("editDescription").value = product.description;

            document.getElementById("editFormContainer").style.display = "block";

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        })

        .catch(error => {

            console.error("Edit Product Error:", error);

        });

}

function cancelEdit() {

    document.getElementById("editFormContainer").style.display = "none";

}


            function updateProduct() {

    const id = document.getElementById("editProductId").value;

    const updatedProduct = {

        name: document.getElementById("editName").value,

        price: Number(
            document.getElementById("editPrice").value
        ),

        imageUrl: document.getElementById("editImageUrl").value,

        description: document.getElementById("editDescription").value

    };


    authFetch(`http://localhost:8080/api/products/${id}`, {

        method: "PUT",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify(updatedProduct)

    })

        .then(response => response.json())

        .then(data => {

            console.log("Product Updated:", data);

            alert("Product updated successfully! ✅");

            document.getElementById("editFormContainer").style.display = "none";

            loadProducts();

        })

        .catch(error => {

            console.error("Update Error:", error);

        });

}





        // =====================================
        // DELETE PRODUCT
        // =====================================

        function deleteProduct(id) {


            if (!confirm(
                "Are you sure you want to delete this product?"
            )) {

                return;

            }


            authFetch(
                `http://localhost:8080/api/products/${id}`,
                {
                    method: "DELETE"
                }
            )

                .then(response => response.text())

                .then(message => {


                    console.log(message);


                    loadProducts();


                })

                .catch(error => {

                    console.error(
                        "Delete Error:",
                        error
                    );

                });

        }

        



        // =====================================
        // INITIAL LOAD
        // =====================================

        loadProducts();

        function loadOrders() {

    authFetch("http://localhost:8080/api/orders")

        .then(response => response.json())

        .then(orders => {

            const orderList =
                document.getElementById("orderList");

            orderList.innerHTML = "";

            orders.forEach(order => {

                const orderDiv =
                    document.createElement("div");

                orderDiv.innerHTML = `
                    <h3>Order #${order.id}</h3>

                    <p>
                        <strong>Customer:</strong>
                        ${order.customerName}
                    </p>

                    <p>
                        <strong>Email:</strong>
                        ${order.customerEmail}
                    </p>

                    <p>
                        <strong>Address:</strong>
                        ${order.customerAddress}
                    </p>

                    <p>
                        <strong>Total:</strong>
                        ₹${order.totalAmount}
                    </p>

                    <p>
    <strong>Status:</strong>

    <select
        onchange="updateOrderStatus(${order.id}, this.value)"
    >

        <option value="PLACED"
            ${order.status === "PLACED" ? "selected" : ""}>
            PLACED
        </option>

        <option value="CONFIRMED"
            ${order.status === "CONFIRMED" ? "selected" : ""}>
            CONFIRMED
        </option>

        <option value="SHIPPED"
            ${order.status === "SHIPPED" ? "selected" : ""}>
            SHIPPED
        </option>

        <option value="DELIVERED"
            ${order.status === "DELIVERED" ? "selected" : ""}>
            DELIVERED
        </option>

    </select>

</p>

                    <hr>
                `;

                orderList.appendChild(orderDiv);

            });

        })

        .catch(error => {

            console.error(
                "Order Loading Error:",
                error
            );

        });

}


function updateOrderStatus(id, status) {

    authFetch(
        `http://localhost:8080/api/orders/${id}/status?status=${status}`,
        {
            method: "PUT"
        }
    )

        .then(response => response.json())

        .then(data => {

            console.log(
                "Order Status Updated:",
                data
            );

            alert(
                "Order status updated successfully! ✅"
            );

        })

        .catch(error => {

            console.error(
                "Order Status Update Error:",
                error
            );

        });

}

loadOrders();


        


    </script>


</body>

</html>
