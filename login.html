<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RAHUL.SHOP - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
        }

        .login-container {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #222;
        }

        .shop-name {
            text-align: center;
            color: #555;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .register-link a {
            color: #007bff;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="login-container">

    <h1>Login</h1>

    <p class="shop-name">RAHUL.SHOP</p>

    <form id="loginForm">

        <label for="email">Email</label>

        <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
        >

        <label for="password">Password</label>

        <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p id="message"></p>

    <div class="register-link">
        Don't have an account?
        <a href="register.html">Register</a>
    </div>

</div>


<script>

    const loginForm = document.getElementById("loginForm");

    loginForm.addEventListener("submit", function(event) {

        event.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        fetch("http://localhost:8080/api/users/login", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                email: email,
                password: password
            })

        })

        .then(response => {

            if (!response.ok) {
                throw new Error("Invalid email or password");
            }

            return response.json();
        })

        .then(data => {

            // JWT Token browser me save
            localStorage.setItem("token", data.token);

            // User information bhi save
            localStorage.setItem("user", JSON.stringify(data));

            document.getElementById("message").innerText =
                "Login successful! ✅";

            // Home page par redirect
           // Role ke according redirect
setTimeout(() => {
    if (data.role === "ADMIN") {
        window.location.href = "admin.html";
    } else {
        window.location.href = "index.html";
    }
}, 1000);

        })

        .catch(error => {

            document.getElementById("message").innerText =
                "Invalid email or password ❌";

            console.error(error);

        });

    });

</script>

</body>
</html>
