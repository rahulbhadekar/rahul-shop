<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Track Order - RAHUL.SHOP</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        .order-info {
            margin-top: 30px;
        }

        .status {
            margin-top: 30px;
            padding: 20px;
            background: #f1f1f1;
            border-radius: 10px;
        }

        .status-step {
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            background: #ddd;
        }

        .active {
            background: #28a745;
            color: white;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            background: #222;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

    </style>

</head>


<body>


<div class="container">

    <h1>📦 Track Your Order</h1>


    <div class="search-box">

        <input
            type="number"
            id="orderId"
            placeholder="Enter Order ID"
        >

        <button onclick="trackOrder()">
            Track
        </button>

    </div>


    <div
        id="orderInfo"
        class="order-info">
    </div>


</div>

<script src="auth.js"></script>

<script>

function trackOrder() {

    const id =
        document.getElementById("orderId").value;


    if (!id) {

        alert("Please enter Order ID");

        return;

    }


    authFetch(
        `https://rahul-shop-backend.onrender.com/api/orders/${id}`
    )

        .then(response => {

            if (!response.ok) {

                throw new Error("Order not found");

            }

            return response.json();

        })

        .then(order => {

            showOrder(order);

        })

        .catch(error => {

            console.error(error);

            document.getElementById("orderInfo").innerHTML =

                "<p>Order not found ❌</p>";

        });

}



function showOrder(order) {

    const orderInfo =
        document.getElementById("orderInfo");


    const statuses = [
        "PLACED",
        "CONFIRMED",
        "SHIPPED",
        "DELIVERED"
    ];


    let html = `

        <h2>Order #${order.id}</h2>

        <p>
            <strong>Customer:</strong>
            ${order.customerName}
        </p>

        <p>
            <strong>Total:</strong>
            ₹${order.totalAmount}
        </p>

        <div class="status">

            <h3>
                Current Status:
                ${order.status}
            </h3>

    `;


    statuses.forEach(status => {

        const active =
            statuses.indexOf(status)
            <= statuses.indexOf(order.status);

        html += `

            <div class="status-step
                ${active ? "active" : ""}">

                ${status}

            </div>

        `;

    });


    html += `

        </div>

    `;


    orderInfo.innerHTML = html;

}

</script>


</body>

</html>
